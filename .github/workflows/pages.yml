name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # リポジトリルートは pnpm workspaces。web が sim のソースを直接
      # import するため、ルートで一度に install する (ci.yml と同じ理由)。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages は https://<owner>.github.io/<repo>/ のサブパスに
      # 配置されるので、リポジトリ名を base path として vite に渡す。
      - name: Build
        working-directory: packages/web
        run: pnpm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # enablement: true — 初回はリポジトリで GitHub Pages がまだ有効化されて
      # いないため、configure-pages 自身に有効化させる (Settings > Pages を
      # 手動で開かなくてもよいように)。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
